<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ───────────────────────── constants ───────────────────────── */
const FPS = 60, FRAMES = 480, W = 1080;
const BODY = 0xFFCC00, HOT = 0xFF6A2B, INK = 0x0F0F0F, PAPER = 0xF4F2EE;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * t * (t * (t * 6 - 15) + 10); };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ───────────────────────── renderer ───────────────────────── */
const canvas = document.getElementById('c');
const qs = new URLSearchParams(location.search), stage = document.getElementById('stage');
const CAPTURE = qs.has('capture') || qs.has('f') || qs.has('demo');
const LITE = !CAPTURE && (matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 700);
function poster() { stage.innerHTML = '<img id="poster" src="og.jpg" alt="Animation Principles Loop">'; }
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: CAPTURE, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) throw new Error('WebGL2 required');
} catch (e) { poster(); throw e; }
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); poster(); });
renderer.setPixelRatio(1);
renderer.setSize(W, W, false);   // resized to the device in resize()
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.autoClear = true;

const scene = new THREE.Scene();
const bgColor = new THREE.Color(PAPER);
const PAPER_LIN = new THREE.Color(PAPER);
scene.background = bgColor;
const camera = new THREE.PerspectiveCamera(18, 1, 10, 120);

/* registries used by the emissive (bloom) pass */
const opaques = [], hidden = [], emis = [];
const dark = new THREE.MeshBasicMaterial({ color: 0x000000 });
const solid = (m, cast = true, recv = true) => { m.castShadow = cast; m.receiveShadow = recv; opaques.push(m); return m; };

/* ───────────────────────── lights ───────────────────────── */
const WARM = new THREE.Color().setRGB(1.04, 0.985, 0.90);   // 3200 K against a ~5600 K balance
const COOL = new THREE.Color().setRGB(0.78, 0.90, 1.18);    // 7500 K
const NEUT = new THREE.Color().setRGB(1.0, 0.97, 0.91);     // 5000 K
const FILL = 0.27;                                          // lights-off level (≈ 50 % on screen)
const KEY_AZ = 50 * Math.PI / 180, KEY_EL = 28 * Math.PI / 180;
const keyDir = new THREE.Vector3(Math.sin(KEY_AZ) * Math.cos(KEY_EL), Math.sin(KEY_EL), Math.cos(KEY_AZ) * Math.cos(KEY_EL));
const KEY_FRONT = 1 - FILL;                                 // key + fill on a +Z face = albedo
const KEY_I = KEY_FRONT / keyDir.z;
// fill tint chosen so fill + key is neutral on the front face: the lit face reads its albedo
const AMB = new THREE.Color().setRGB((1 - KEY_FRONT * WARM.r) / FILL, (1 - KEY_FRONT * WARM.g) / FILL, (1 - KEY_FRONT * WARM.b) / FILL);

const amb = new THREE.AmbientLight(AMB, FILL * Math.PI);
scene.add(amb);

const key = new THREE.DirectionalLight(WARM, 0);
key.position.copy(keyDir).multiplyScalar(22);
key.castShadow = true;
key.shadow.mapSize.set(LITE ? 1024 : 2048, LITE ? 1024 : 2048);
Object.assign(key.shadow.camera, { left: -10, right: 10, top: 9, bottom: -9, near: 2, far: 50 });
key.shadow.radius = 5; key.shadow.bias = -0.0006; key.shadow.normalBias = 0.025;
scene.add(key, key.target);

const rimDir = new THREE.Vector3(-0.78, 0.42, -0.46).normalize();
const rim = new THREE.DirectionalLight(COOL, 0);
rim.position.copy(rimDir).multiplyScalar(22);
scene.add(rim, rim.target);

const LAMP = new THREE.Vector3(0.5, 6.0, -0.6);
const spot = new THREE.SpotLight(NEUT, 0, 0, 17 * Math.PI / 180, 0.55, 2);   // 34° pool, 45 cd
spot.position.copy(LAMP);
spot.target.position.set(LAMP.x, 0, LAMP.z);
spot.castShadow = true;
spot.shadow.mapSize.set(LITE ? 512 : 1024, LITE ? 512 : 1024);
spot.shadow.radius = 4; spot.shadow.bias = -0.0008; spot.shadow.normalBias = 0.02;
spot.shadow.camera.near = 1; spot.shadow.camera.far = 9;
scene.add(spot, spot.target);

const headLight = new THREE.PointLight(HOT, 0, 3.6, 2);
scene.add(headLight);

/* ───────────────────────── set: the court ───────────────────────── */
const CW = 3.6, CL = 6.0, PZ = 5.3, BR = 0.17;          // rail half-width, baseline, paddle line, ball radius
const mWhite = new THREE.MeshStandardMaterial({ color: 0xE7E6E2, roughness: 0.72 });
const mCourt = new THREE.MeshStandardMaterial({ color: 0xEFEEEA, roughness: 0.6 });
const mInk = new THREE.MeshStandardMaterial({ color: INK, roughness: 0.5 });
const mRig = new THREE.MeshStandardMaterial({ color: 0x1B1B1C, roughness: 0.45, metalness: 0.3 });
const mShell = new THREE.MeshStandardMaterial({ color: 0x151516, roughness: 0.7 });
const mTape = new THREE.MeshStandardMaterial({ color: BODY, roughness: 0.5 });
const box = (w, h, d, mat, x, y, z, cast = false) => { const m = solid(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat), cast, true); m.position.set(x, y, z); scene.add(m); return m; };

const slab = solid(new THREE.Mesh(new RoundedBoxGeometry(9.4, 0.5, 14.4, 3, 0.07), mWhite), false, true);
slab.position.y = -0.25; scene.add(slab);
{ // soft shadow hanging in the void under the slab
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(0,0,0,0.5)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.26)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(15, 22), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.position.set(0, -2.0, 0.8); scene.add(blob); hidden.push(blob);
}
box(CW * 2, 0.012, CL * 2, mCourt, 0, 0.006, 0);                                   // playing surface
for (const z of [-CL, CL]) box(CW * 2 + 0.07, 0.016, 0.07, mInk, 0, 0.012, z);      // baselines
box(0.05, 0.016, CL * 2, mInk, 0, 0.012, 0);                                       // centre line
for (const x of [-1, 1]) { box(0.16, 0.24, CL * 2 + 0.3, mShell, x * (CW + 0.08), 0.12, 0, true); box(0.16, 0.03, CL * 2 + 0.3, mTape, x * (CW + 0.08), 0.255, 0); }   // side rails
box(CW * 2 + 0.5, 0.4, 0.05, mShell, 0, 0.2, 0, true); box(CW * 2 + 0.5, 0.06, 0.08, mTape, 0, 0.43, 0);   // net + tape
for (const x of [-1, 1]) box(0.1, 0.52, 0.1, mShell, x * (CW + 0.3), 0.26, 0, true);

const glowTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(cv);
})();
const glows = [];
// the ball glows, so the court still plays with every light off
const ball = new THREE.Mesh(new THREE.SphereGeometry(BR, 20, 14), new THREE.MeshBasicMaterial({ color: HOT }));
scene.add(ball);
const ballGlow = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), new THREE.MeshBasicMaterial({ map: glowTex, color: HOT, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
ballGlow.rotation.x = -Math.PI / 2; scene.add(ballGlow); glows.push(ballGlow);

/* ───────────────────────── set: light stands (each one a rig the visitor can drag) ───────────────────────── */
function cyl(a, b, r, parent, mat = mRig) {
  const d = new THREE.Vector3().subVectors(b, a), m = solid(new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 10), mat), false, false);
  m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  parent.add(m); return m;
}
function stand(parent, x, z, h, spread = 0.42, rot = 0) {
  cyl(new THREE.Vector3(x, 0.04, z), new THREE.Vector3(x, h, z), 0.032, parent);
  for (let i = 0; i < 3; i++) {
    const a = rot + i * 2.0944, f = new THREE.Vector3(x + Math.cos(a) * spread, 0.025, z + Math.sin(a) * spread);
    cyl(new THREE.Vector3(x, 0.62, z), f, 0.022, parent);
    const foot = solid(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.045, 0.03, 10), mShell), false, false); foot.position.copy(f).setY(0.015); parent.add(foot);
  }
}
const panelMat = () => new THREE.MeshBasicMaterial({ color: 0x777777 });
const rigs = { key: new THREE.Group(), rim: new THREE.Group(), top: new THREE.Group() };
scene.add(rigs.key, rigs.rim, rigs.top);

// key softbox, front right, 28° above the stage
const softbox = new THREE.Group(), SOFT = new THREE.Vector3(4.15, 3.45, 3.3);
{
  rigs.key.position.set(SOFT.x, 0, SOFT.z);
  stand(rigs.key, 0, 0, SOFT.y - 0.3, 0.34, 0.5);
  const shell = solid(new THREE.Mesh(new THREE.CylinderGeometry(0.92, 0.3, 0.6, 4, 1), mShell), false, false);
  shell.rotation.set(Math.PI / 2, Math.PI / 4, 0, 'XYZ'); shell.position.z = -0.3;
  const face = new THREE.Mesh(new THREE.PlaneGeometry(1.22, 1.22), panelMat()); face.position.z = 0.012;
  const lip = solid(new THREE.Mesh(new THREE.BoxGeometry(1.34, 1.34, 0.05), mShell), false, false); lip.position.z = -0.02;
  softbox.add(shell, lip, face); softbox.position.set(0, SOFT.y, 0); softbox.scale.set(1, 0.8, 1);
  rigs.key.add(softbox);
  emis.push({ mesh: face, on: new THREE.Color().setRGB(2.6, 2.1, 1.45), off: new THREE.Color(0x6E6C68), light: 'key' });
}
// rim strip, back left, panel turned to the lens
const STRIP = new THREE.Vector3(-4.15, 1.95, -5.4), strip = new THREE.Group();
{
  rigs.rim.position.set(STRIP.x, 0, STRIP.z);
  stand(rigs.rim, 0, 0, 1.1, 0.4, 0.2);
  strip.position.set(0, STRIP.y, 0);
  const body = solid(new THREE.Mesh(new RoundedBoxGeometry(0.4, 1.8, 0.16, 2, 0.03), mShell), false, false);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 1.66), panelMat()); face.position.z = 0.085;
  strip.add(body, face); rigs.rim.add(strip);
  emis.push({ mesh: face, on: new THREE.Color().setRGB(1.5, 1.9, 2.7), off: new THREE.Color(0x6A6C70), light: 'rim' });
}
// top spot on a boom from the back right corner (the whole rig slides as one)
const lampRim = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.035, 10, 40), panelMat());
let cone;
{
  const R = rigs.top;
  const base = new THREE.Vector3(4.15, 0, -6.5), top = new THREE.Vector3(4.15, 4.7, -6.5), tip = new THREE.Vector3(LAMP.x, LAMP.y + 0.42, LAMP.z);
  stand(R, base.x, base.z, top.y, 0.42, 0.9);
  const back = top.clone().addScaledVector(new THREE.Vector3().subVectors(top, tip).normalize(), 0.7);
  cyl(back, tip, 0.028, R);
  const cw = solid(new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.22, 12), mShell), false, false); cw.position.copy(back); R.add(cw);
  cyl(tip, new THREE.Vector3(LAMP.x, LAMP.y + 0.18, LAMP.z), 0.02, R);
  const can = solid(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.36, 0.48, 24, 1, true), new THREE.MeshStandardMaterial({ color: 0x151516, roughness: 0.6, side: THREE.DoubleSide })), false, false);
  can.position.set(LAMP.x, LAMP.y - 0.06, LAMP.z); R.add(can);
  const capm = solid(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.04, 24), mShell), false, false); capm.position.set(LAMP.x, LAMP.y + 0.18, LAMP.z); R.add(capm);
  lampRim.rotation.x = Math.PI / 2; lampRim.position.set(LAMP.x, LAMP.y - 0.3, LAMP.z); R.add(lampRim);
  emis.push({ mesh: lampRim, on: new THREE.Color().setRGB(2.8, 2.6, 2.2), off: new THREE.Color(0x3A3A3A), light: 'top' });
  // faint visible beam
  const cv = document.createElement('canvas'); cv.width = 4; cv.height = 128;
  const g = cv.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 128);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 4, 128);
  const hgt = LAMP.y - 0.3;
  cone = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.33 + hgt * Math.tan(17 * Math.PI / 180), hgt, 40, 1, true),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), color: NEUT, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  cone.position.set(LAMP.x, hgt / 2, LAMP.z); R.add(cone); hidden.push(cone);
}
// The lights follow their stands: moving a stand swings its light round the stage by the same angle.
const RIM0 = rimDir.clone(), RIG_LIMIT = { x: 4.3, z: 6.8 };
function aimLights() {
  const k = rigs.key.position, az = KEY_AZ + Math.atan2(k.x, k.z) - Math.atan2(SOFT.x, SOFT.z);

$('help').addEventListener('click', () => { const b = $('help'), on = !b.classList.contains('on'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); stage.classList.toggle('nohelp', !on); });
const held = new Set();
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button')) return;
  const k = e.key.toLowerCase();
  if (e.shiftKey && k.startsWith('arrow')) orbit(k === 'arrowleft' ? 0.1 : k === 'arrowright' ? -0.1 : 0, k === 'arrowup' ? 0.08 : k === 'arrowdown' ? -0.08 : 0);
  else if (k === 'arrowleft' || k === 'a') held.add(-1); else if (k === 'arrowright' || k === 'd') held.add(1);
  else if (e.code === 'Space' || e.code === 'Enter') act();
  else if (k === 'h' || k === 'l') { if (M.state === 'choose' || M.state === 'over') choose(k === 'h' ? 'hi' : 'lo'); else return; }
  else if (k === '0') setView(0); else if (k === 'k') toggleLight('key'); else if (k === 'r') toggleLight('rim'); else if (k === 't') toggleLight('top'); else if (k === 's') toggleSound();
  else if (k === '+' || k === '=') zoom(0.9); else if (k === '-') zoom(1.1); else return;
  e.preventDefault(); keyMove = (held.has(1) ? 1 : 0) - (held.has(-1) ? 1 : 0);
});
addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k === 'arrowleft' || k === 'a') held.delete(-1); if (k === 'arrowright' || k === 'd') held.delete(1); keyMove = (held.has(1) ? 1 : 0) - (held.has(-1) ? 1 : 0); });

/* record a clip of the court (with sound when it is on), then share or save it */
const recBtn = $('rec'); let rec = null, clip = null, recT = 0, recStop = 0;
if (!(canvas.captureStream && window.MediaRecorder)) recBtn.hidden = true;
function recStart() {
  const stream = canvas.captureStream(60);
  if (kit && soundOn) { const d = kit.ctx.createMediaStreamDestination(); kit.comp.connect(d); d.stream.getAudioTracks().forEach(t => stream.addTrack(t)); }
  const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const chunks = []; rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 8e6 });
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { const ext = (rec.mimeType || type).includes('mp4') ? 'mp4' : 'webm'; clip = new File(chunks, 'hi-and-lo.' + ext, { type: (rec.mimeType || type).split(';')[0] }); rec = null; recBtn.classList.remove('on'); recBtn.classList.add('ready'); recBtn.textContent = navigator.canShare && navigator.canShare({ files: [clip] }) ? 'SHARE CLIP' : 'SAVE CLIP'; };
  rec.start(); recT = performance.now(); recBtn.classList.add('on'); clearTimeout(recStop); recStop = setTimeout(() => rec && rec.stop(), 12000);
}
async function recShare() {
  const f = clip; clip = null; recBtn.classList.remove('ready'); recBtn.textContent = 'REC';
  try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Hi & Lo' }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
recBtn.addEventListener('click', () => { if (rec) { clearTimeout(recStop); rec.stop(); } else if (clip) recShare(); else try { recStart(); } catch (e) { recBtn.textContent = 'NO REC'; } });

/* test hooks */
const scr = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera), r = canvas.getBoundingClientRect(); return [r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height]; };
window.debugPos = n => n === 'court' ? scr(me.x, 0.7, PZ) : n.startsWith('x') ? scr(+n.slice(1), 0.7, PZ) : (() => { const t = targets.find(o => o.userData.hit === n).getWorldPosition(new THREE.Vector3()); return scr(t.x, t.y, t.z); })();
window.debugState = () => ({ t: +T.toFixed(1), state: M.state, me: me === hi ? 'hi' : 'lo', mx: +me.x.toFixed(2), faces: [hi, lo].map(p => p.eyes[0].visible ? 1 : 0).join(''), z: [hi.root.position.z, lo.root.position.z], hi: hi.score, lo: lo.score, rally: M.rally, hx: +hi.x.toFixed(2), lx: +lo.x.toFixed(2), bx: +B.x.toFixed(2), bz: +B.z.toFixed(2), by: +B.y.toFixed(2), speed: +B.speed.toFixed(1), lights: Object.fromEntries(Object.entries(L3).map(([k, l]) => [k, l.on])), rig: Object.fromEntries(Object.entries(rigs).map(([k, r]) => [k, [+r.position.x.toFixed(2), +r.position.z.toFixed(2)]])), view: ORDER[view], mood: moodEl.textContent, rec: rec ? 'recording' : clip ? clip.name + ' ' + clip.size : 'idle' });
window.debugCam = () => ({ az: +(U.az * 180 / Math.PI).toFixed(1), el: +(U.el * 180 / Math.PI).toFixed(1), dist: +U.dist.toFixed(1) });
window.debugAuto = on => { autoHi = on; };                   // lets a test play Hi perfectly
let autoHi = false;
window.debugSim = (secs, wob = 0.6) => { const rallies = []; let r0 = 0, pts0 = hi.score + lo.score; if (M.state === 'choose') choose('hi'); say(''); if (M.state === 'ready') { M.until = 0; } const h0 = hi.score, l0 = lo.score; for (let i = 0; i < secs * 120; i++) { if (M.state === 'choose') choose('hi'); if (M.state === 'over') { hi.score = lo.score = 0; ready(me, false); } if (B.live) me.tx = clamp(B.x + wob * Math.sin(T * 2.3), -CW + PW / 2, CW - PW / 2); r0 = Math.max(r0, M.rally); const before = hi.score + lo.score; step(1 / 120); if (hi.score + lo.score !== before) { rallies.push(r0); r0 = 0; } } return rallies; };

/* ───────────────────────── boot ───────────────────────── */
resize();
let rz = 0; const onResize = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(resize); };
addEventListener('resize', onResize); addEventListener('orientationchange', onResize);
if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
// adaptive quality: average frame time over a window, step the ladder with hysteresis
let qLast = 0, qAcc = 0, qCnt = 0, qCalm = 0;
function adapt(ts) {
  if (qLast) { const dt = ts - qLast; if (dt < 400) { qAcc += dt; qCnt++; } }
  qLast = ts;
  if (qCnt < 24) return;
  const ms = qAcc / qCnt; qAcc = qCnt = 0;
  if (ms > 34 && level < LADDER.length - 1) { setLevel(level + (ms > 70 ? 2 : 1)); qCalm = 0; qLast = 0; }
  else if (ms < 18.5 && level > 0) { if (++qCalm >= 8) { setLevel(level - 1); qCalm = -8; qLast = 0; } }
  else qCalm = Math.min(qCalm, 0);
}


setScore(); say('PLAY AS', PICK);
window.ready = (async () => {
  try { await document.fonts.load('500 28px "Geist Mono"'); await document.fonts.ready; } catch (e) {}
  renderer.compile(scene, camera); render(); draw(); return true;
})();
let prev = 0;
const loop = ts => {
  requestAnimationFrame(loop);
  if (document.hidden) { qLast = 0; prev = 0; return; }
  const dt = prev ? Math.min(0.05, (ts - prev) / 1000) : 0.016; prev = ts;
  if (autoHi && B.live) me.tx = clamp(B.x + 0.6 * Math.sin(T * 2.3), -CW + PW / 2, CW - PW / 2);
  for (let n = Math.max(1, Math.round(dt * 120)), i = 0; i < n; i++) step(dt / n);        // small physics steps so a fast ball cannot tunnel
  const k = 1 - Math.exp(-dt * 8); U.az += (U.taz - U.az) * k; U.el += (U.tel - U.el) * k; U.dist += (U.tdist - U.dist) * k;
  render(); draw(); if (!rec) adapt(ts);                        // hold the resolution steady while recording
  if (rec) recBtn.textContent = '● ' + ((performance.now() - recT) / 1000).toFixed(1) + 's';
};
if (!DEMO) window.ready.then(() => requestAnimationFrame(loop));

/* ───────────────────────── ?demo — the scripted 21 s film, drawn frame by frame ───────────────────────── */
if (DEMO) {
  const DUR = 20, go = (az, el, dist) => { U.taz = az * Math.PI / 180; U.tel = el * Math.PI / 180; U.tdist = dist; };   // the camera moves as if turned by hand
  ui.style.display = 'none'; choose('hi'); say(''); for (const n of ['key', 'rim', 'top']) L3[n].on = false;
  const EV = [
    [0.5, () => toggleLight('key')], [1.0, () => toggleLight('rim')], [1.5, () => toggleLight('top')], [2.0, () => serve()],
    [4.0, () => go(-34, 26, 38)], [6.0, () => toggleLight('top')], [6.5, () => toggleLight('key')], [7.0, () => { toggleLight('rim'); go(0, 14, 34); }],
    [8.5, () => toggleLight('rim')], [9.5, () => go(-64, 20, 40)], [10.0, () => toggleLight('top')], [10.5, () => toggleLight('key')],
    [12.0, () => go(30, 30, 36)], [14.0, () => go(0, 78, 44)], [15.6, () => { go(0, 36, 41); DEMO.miss = true; }],
    [19.0, () => toggleLight('top')], [19.25, () => toggleLight('rim')], [19.5, () => toggleLight('key')],
  ];
  let fr = -1;
  window.DEMO_FRAMES = DUR * FPS;
  window.demoFrame = i => {
    for (; fr < i; ) {
      fr++; const t = fr / FPS;
      for (const e of EV) if (!e[2] && t >= e[0]) { e[2] = true; e[1](); }
      if (B.live) me.tx = clamp(B.x + 0.62 * Math.sin(T * 2.3), -CW + PW / 2, CW - PW / 2);
      if (me.score > 0) DEMO.miss = false;
      step(1 / 120); step(1 / 120);
      const k = 1 - Math.exp(-3.2 / FPS); U.az += (U.taz - U.az) * k; U.el += (U.tel - U.el) * k; U.dist += (U.tdist - U.dist) * k;
    }
    const t = i / FPS;
    moodEl.classList.toggle('off', !(DEMO.moodAt != null && T - DEMO.moodAt < 1.7));
    render(); draw();
  };
  // the soundtrack: the game's own sounds, replayed at their logged times and rendered offline
  window.demoAudio = async () => {
    const rate = 48000, ctx = new OfflineAudioContext(2, rate * DUR, rate), K = makeKit(ctx);
    pads = {}; for (const n of ['key', 'rim', 'top']) pads[n] = PAD[n].map(v => K.pad(...v));
    for (const [t, fn] of DEMO.log) fn(K, t + 1 / FPS);
    const buf = await ctx.startRendering(), n = buf.length, ch = [buf.getChannelData(0), buf.getChannelData(1)];
    const b = new DataView(new ArrayBuffer(44 + n * 4)), w = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); b.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt '); b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 2, true);
    b.setUint32(24, rate, true); b.setUint32(28, rate * 4, true); b.setUint16(32, 4, true); b.setUint16(34, 16, true); w(36, 'data'); b.setUint32(40, n * 4, true);
    for (let i = 0, o = 44; i < n; i++) for (let c = 0; c < 2; c++, o += 2) b.setInt16(o, Math.round(clamp(ch[c][i], -1, 1) * 32767), true);
    const u = new Uint8Array(b.buffer); let bin = ''; for (let i = 0; i < u.length; i += 32768) bin += String.fromCharCode.apply(null, u.subarray(i, i + 32768));
    return { b64: btoa(bin), events: DEMO.log.length, score: [hi.score, lo.score] };
  };
}
