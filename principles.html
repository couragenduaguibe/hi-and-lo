<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ───────────────────────── constants ───────────────────────── */
const FPS = 60, FRAMES = 480, DUR = FRAMES / FPS, W = 1080;
const BODY = 0xFFCC00, HOT = 0xFF6A2B, INK = 0x0F0F0F, PAPER = 0xF4F2EE, CELL = 0xEFEEEA;
const DX = [-4, -2, 0, 2, 4];                        // keyframe diamonds
const CLICK = { key: 6, rim: 24, top: 42, off: 468 };
const HOPS = [0, 1, 2, 3].map(i => ({ c: 69 + 60 * i, t: 80 + 60 * i, l: 105 + 60 * i, x0: DX[i], x1: DX[i + 1] }));
const FLIP = { arc0: 303, arc1: 318, c: 312, t: 330, l: 384, h: 3.5 };
const LANDS = [                                       // frame, x, squash (dx, dy), diamond index
  ...HOPS.map((h, i) => ({ f: h.l, x: h.x1, ax: 0.25, ay: -0.30, d: i + 1, pow: 1 })),
  { f: FLIP.l, x: DX[0], ax: 0.32, ay: -0.38, d: 0, pow: 1.45 },
];
const LABEL_F = [69, 140, 200, 285, 303];
const BLINK = 432;
const CH = 0.9;                                       // mascot body centre height
const EL = 30 * Math.PI / 180;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * t * (t * (t * 6 - 15) + 10); };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ───────────────────────── renderer ───────────────────────── */
const canvas = document.getElementById('c');
const qs = new URLSearchParams(location.search), stage = document.getElementById('stage');
const CAPTURE = qs.has('capture') || qs.has('f');
const LOOP = CAPTURE || qs.has('loop');                                    // the original fixed 8 s choreography; default is interactive                         // offline render: fixed 1080 square, full quality
const LITE = !CAPTURE && (matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 700);
function poster() { stage.innerHTML = '<img id="poster" src="og.jpg" alt="Animation Principles Loop">'; }
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: CAPTURE, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) throw new Error('WebGL2 required');
} catch (e) { poster(); throw e; }
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); poster(); });
renderer.setPixelRatio(1);
renderer.setSize(W, W, false);   // resized to the device in resize()
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.autoClear = true;

const scene = new THREE.Scene();
const bgColor = new THREE.Color(PAPER);
const PAPER_LIN = new THREE.Color(PAPER);
scene.background = bgColor;
const camera = new THREE.PerspectiveCamera(18, 1, 10, 120);

/* registries used by the emissive (bloom) pass */
const opaques = [], hidden = [], emis = [];
const dark = new THREE.MeshBasicMaterial({ color: 0x000000 });
const solid = (m, cast = true, recv = true) => { m.castShadow = cast; m.receiveShadow = recv; opaques.push(m); return m; };

/* ───────────────────────── lights ───────────────────────── */
const WARM = new THREE.Color().setRGB(1.04, 0.985, 0.90);   // 3200 K against a ~5600 K balance
const COOL = new THREE.Color().setRGB(0.78, 0.90, 1.18);    // 7500 K
const NEUT = new THREE.Color().setRGB(1.0, 0.97, 0.91);     // 5000 K
const FILL = 0.27;                                          // lights-off level (≈ 50 % on screen)
const KEY_AZ = 50 * Math.PI / 180, KEY_EL = 28 * Math.PI / 180;
const keyDir = new THREE.Vector3(Math.sin(KEY_AZ) * Math.cos(KEY_EL), Math.sin(KEY_EL), Math.cos(KEY_AZ) * Math.cos(KEY_EL));
const KEY_FRONT = 1 - FILL;                                 // key + fill on a +Z face = albedo
const KEY_I = KEY_FRONT / keyDir.z;
// fill tint chosen so fill + key is neutral on the front face: the lit face reads its albedo
const AMB = new THREE.Color().setRGB((1 - KEY_FRONT * WARM.r) / FILL, (1 - KEY_FRONT * WARM.g) / FILL, (1 - KEY_FRONT * WARM.b) / FILL);

const amb = new THREE.AmbientLight(AMB, FILL * Math.PI);
scene.add(amb);

const key = new THREE.DirectionalLight(WARM, 0);
key.position.copy(keyDir).multiplyScalar(22);
key.castShadow = true;
key.shadow.mapSize.set(LITE ? 1024 : 2048, LITE ? 1024 : 2048);
Object.assign(key.shadow.camera, { left: -8.5, right: 8.5, top: 7, bottom: -5, near: 2, far: 44 });
key.shadow.radius = 5; key.shadow.bias = -0.0006; key.shadow.normalBias = 0.025;
scene.add(key, key.target);

const rimDir = new THREE.Vector3(-0.78, 0.42, -0.46).normalize();
const rim = new THREE.DirectionalLight(COOL, 0);
rim.position.copy(rimDir).multiplyScalar(22);
scene.add(rim, rim.target);

const LAMP = new THREE.Vector3(1.6, 5.8, -0.2);
const spot = new THREE.SpotLight(NEUT, 0, 0, 17 * Math.PI / 180, 0.55, 2);   // 34° pool, 45 cd
spot.position.copy(LAMP);
spot.target.position.set(LAMP.x, 0, LAMP.z);
spot.castShadow = true;
spot.shadow.mapSize.set(LITE ? 512 : 1024, LITE ? 512 : 1024);
spot.shadow.radius = 4; spot.shadow.bias = -0.0008; spot.shadow.normalBias = 0.02;
spot.shadow.camera.near = 1; spot.shadow.camera.far = 9;
scene.add(spot, spot.target);

const headLight = new THREE.PointLight(HOT, 0, 3.6, 2);
scene.add(headLight);

/* ───────────────────────── set: slab + timeline ───────────────────────── */
const mWhite = new THREE.MeshStandardMaterial({ color: 0xE7E6E2, roughness: 0.72 });
const mLane = new THREE.MeshStandardMaterial({ color: 0xD9D6CF, roughness: 0.8 });
const mCell = new THREE.MeshStandardMaterial({ color: CELL, roughness: 0.6 });
const mInk = new THREE.MeshStandardMaterial({ color: INK, roughness: 0.5 });
const mRig = new THREE.MeshStandardMaterial({ color: 0x1B1B1C, roughness: 0.45, metalness: 0.3 });
const mShell = new THREE.MeshStandardMaterial({ color: 0x151516, roughness: 0.7 });

const slab = solid(new THREE.Mesh(new RoundedBoxGeometry(12, 0.5, 6, 3, 0.07), mWhite), false, true);
slab.position.y = -0.25;
scene.add(slab);

// soft contact shadow hanging in the void under the slab
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(0,0,0,0.5)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.26)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(18, 11), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.position.set(0, -2.0, 0.6);
  scene.add(blob); hidden.push(blob);
}

const TRACK_Z = [-0.95, 0, 0.95], TRACK_D = 0.84, CELL_W = 0.25, NCELL = 44, X0 = -5.5;
for (const z of TRACK_Z) {
  const lane = solid(new THREE.Mesh(new THREE.BoxGeometry(NCELL * CELL_W + 0.04, 0.01, TRACK_D + 0.04), mLane), false, true);
  lane.position.set(0, 0.004, z); scene.add(lane);
}
const cells = solid(new THREE.InstancedMesh(new THREE.BoxGeometry(CELL_W - 0.022, 0.03, TRACK_D), mCell, NCELL * 3), true, true);
const cellPos = [];
for (let tz = 0; tz < 3; tz++) for (let i = 0; i < NCELL; i++) cellPos.push([X0 + (i + 0.5) * CELL_W, TRACK_Z[tz]]);
scene.add(cells);

let ruler;
function buildRuler() {
  const PPU = 356, cw = 4096, chh = 285;
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = chh;
  const g = cv.getContext('2d');
  const px = x => (x + 5.75) * PPU;
  for (let i = 0; i <= NCELL; i++) {
    const x = X0 + i * CELL_W, major = i % 4 === 2, mid = i % 2 === 0;
    g.fillStyle = major ? '#0F0F0F' : '#8E8A83';
    const w = major ? 11 : 6, h = major ? 70 : mid ? 44 : 26;
    g.fillRect(px(x) - w / 2, chh - h, w, h);
  }
  g.fillStyle = '#0F0F0F'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = '600 112px "Geist Mono", monospace';
  for (let x = -4; x <= 4; x++) { g.save(); g.translate(px(x), 196); g.scale(1, 1.8); g.fillText(String(Math.round(45 + 30 * (x + 4))), 0, 0); g.restore(); }   // stretched in depth so it reads square from 30°
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  ruler = new THREE.Mesh(new THREE.PlaneGeometry(cw / PPU, chh / PPU), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.8, depthWrite: false }));
  ruler.rotation.x = -Math.PI / 2; ruler.position.set(0, 0.003, -1.42 - chh / PPU / 2);
  ruler.receiveShadow = true;
  scene.add(ruler); hidden.push(ruler);
}

// radial glow sprite texture
const glowTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(cv);
})();

// keyframe diamonds
const diamonds = DX.map(x => {
  const grp = new THREE.Group(); grp.position.set(x, 0, 0); grp.rotation.y = Math.PI / 4;
  const out = solid(new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.04, 0.52), mInk), false, true); out.position.y = 0.05;
  const fill = solid(new THREE.Mesh(new THREE.BoxGeometry(0.40, 0.05, 0.40), new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.5 })), false, true); fill.position.y = 0.062;
  const lit = new THREE.Mesh(fill.geometry, new THREE.MeshBasicMaterial({ color: HOT })); lit.position.y = 0.062;
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: glowTex, color: HOT, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.rotation.x = -Math.PI / 2; glow.position.y = 0.034;
  grp.add(out, fill, lit, glow); scene.add(grp);
  return { grp, fill, lit, glow };
});

// playhead: line under the diamonds, cap at the ruler, light bead at the front edge of the tracks
const mHead = new THREE.MeshBasicMaterial({ color: HOT });
const head = new THREE.Group();
{
  const z0 = -1.5, z1 = 1.52;
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.012, z1 - z0), mHead); line.position.set(0, 0.037, (z0 + z1) / 2);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.07, 0.26), mHead); cap.position.set(0, 0.04, z0 - 0.1);
  const bead = new THREE.Mesh(new RoundedBoxGeometry(0.14, 0.14, 0.14, 2, 0.03), mHead); bead.position.set(0, 0.09, z1 + 0.06);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), new THREE.MeshBasicMaterial({ map: glowTex, color: HOT, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.rotation.x = -Math.PI / 2; glow.position.set(0, 0.036, z1 + 0.06);
  head.add(line, cap, bead, glow); head.userData.glow = glow;
  scene.add(head);
}
const HEAD_Z = 1.58;

/* ───────────────────────── set: light stands (each one a rig the visitor can drag) ───────────────────────── */
function cyl(a, b, r, parent, mat = mRig) {
  const d = new THREE.Vector3().subVectors(b, a), m = solid(new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 10), mat), false, false);
  m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  parent.add(m); return m;
}
function stand(parent, x, z, h, spread = 0.42, rot = 0) {
  cyl(new THREE.Vector3(x, 0.04, z), new THREE.Vector3(x, h, z), 0.032, parent);
  for (let i = 0; i < 3; i++) {
    const a = rot + i * 2.0944, f = new THREE.Vector3(x + Math.cos(a) * spread, 0.025, z + Math.sin(a) * spread);
    cyl(new THREE.Vector3(x, 0.62, z), f, 0.022, parent);
    const foot = solid(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.045, 0.03, 10), mShell), false, false); foot.position.copy(f).setY(0.015); parent.add(foot);
  }
}
const panelMat = () => new THREE.MeshBasicMaterial({ color: 0x777777 });
const rigs = { key: new THREE.Group(), rim: new THREE.Group(), top: new THREE.Group() };

  for (let i = 0; i < cellPos.length; i++) {

  viewBtn.addEventListener('click', () => setView(ORDER[(ORDER.indexOf(viewBtn.dataset.v || 'top') + 1) % 4]));
  const setView = n => { const [a, e, d] = VIEWS[n]; U.taz = a * Math.PI / 180; U.tel = e * Math.PI / 180; U.tdist = d; markView(n); S.touched = clock; earn(8); };
  const freeCam = () => { markView(null); S.touched = clock; };
  const orbit = (dx, dy) => { U.taz -= dx; U.tel = clamp(U.tel + dy, 6 * Math.PI / 180, 82 * Math.PI / 180); freeCam(); };
  const zoom = k => { U.tdist = clamp(U.tdist * k, 20, 62); freeCam(); };
  viewBtns.forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

  /* buttons */
  const toggleBtn = (id, cls, fn) => { const b = $(id); b.addEventListener('click', () => { const on = !b.classList.contains('on'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); if (cls) stage.classList.toggle(cls, cls === 'nohelp' ? !on : on); fn && fn(on); }); return b; };
  sndBtn.addEventListener('click', toggleSound);
  toggleBtn('help', 'nohelp'); toggleBtn('tune', 'tune');
  const speedInput = () => rows[5].querySelector('input');
  const setSpeed = v => { P.speed = v; const si = speedInput(); if (si) si.value = v; const sb = $('slow'), on = v < 0.6; sb.classList.toggle('on', on); sb.setAttribute('aria-pressed', on); if (v !== 1) earn(5); };
  $('slow').addEventListener('click', () => setSpeed(P.speed < 0.6 ? 1 : 0.25));
  for (const el of [$('btns'), $('rew'), labelsEl]) el.addEventListener('pointerdown', e => e.stopPropagation());
  // after a mouse or touch press, hand the keyboard back to the stage so Space still jumps (keyboard users keep focus)
  $('btns').addEventListener('click', e => { if (e.detail && e.target.blur) e.target.blur(); });
  for (const el of [$('rew'), labelsEl]) el.addEventListener('pointerup', e => setTimeout(() => e.target.blur && e.target.blur(), 0));

  /* principle dials, shown by TUNE: one slider per principle */
  [['antic', 0, 2], ['squash', 0, 2], ['overlap', 0, 2.5], ['follow', 0, 2.5], ['arc', 0, 2], ['speed', 0.1, 1.5], ['exag', 0.4, 2], ['second', 0, 2]].forEach(([key, lo, hi], i) => {
    const inp = document.createElement('input'); inp.type = 'range'; inp.min = lo; inp.max = hi; inp.step = 0.05; inp.value = 1;
    inp.setAttribute('aria-label', NAMES[i] + ' amount');
    inp.addEventListener('input', () => { const v = +inp.value; if (key === 'speed') setSpeed(v); else P[key] = v; if (key === 'exag' && v > 1.3) earn(6); });
    inp.addEventListener('dblclick', () => { inp.value = 1; inp.dispatchEvent(new Event('input')); });
    rows[i].appendChild(inp);
  });

  /* rewind: drag back through the last few seconds; the clock waits while you look */
  const scrub = $('scrub'), HIST = 270;
  const scrubTo = () => { const lo = Math.max(0, clock - HIST); S.scrubbing = true; S.scrubF = lo + (clock - lo) * scrub.value / 1000; earn(5); };
  scrub.addEventListener('input', scrubTo);
  const scrubEnd = () => { S.scrubbing = false; scrub.value = 1000; };
  scrub.addEventListener('change', scrubEnd); scrub.addEventListener('pointerup', scrubEnd); scrub.addEventListener('blur', scrubEnd);

  /* record a clip of the stage (with sound when it is on), then share or save it */
  const recBtn = $('rec'); let rec = null, clip = null, recT = 0, recStop = 0;
  const canRec = !!(canvas.captureStream && window.MediaRecorder); if (!canRec) recBtn.hidden = true;
  function recStart() {
    const stream = canvas.captureStream(60);
    if (kit && soundOn) { const d = kit.ctx.createMediaStreamDestination(); kit.comp.connect(d); d.stream.getAudioTracks().forEach(t => stream.addTrack(t)); }
    const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const chunks = []; rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 8e6 });
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => { const ext = (rec.mimeType || type).includes('mp4') ? 'mp4' : 'webm'; clip = new File(chunks, 'moodswings-swing.' + ext, { type: (rec.mimeType || type).split(';')[0] }); rec = null; recBtn.classList.remove('on'); recBtn.classList.add('ready'); recBtn.textContent = navigator.canShare && navigator.canShare({ files: [clip] }) ? 'SHARE CLIP' : 'SAVE CLIP'; };
    rec.start(); recT = performance.now(); recBtn.classList.add('on'); clearTimeout(recStop); recStop = setTimeout(() => rec && rec.stop(), 10000);
  }
  async function recShare() {
    const f = clip; clip = null; recBtn.classList.remove('ready'); recBtn.textContent = 'REC';
    try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Moodswings · Swing' }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  recBtn.addEventListener('click', () => { if (rec) { clearTimeout(recStop); rec.stop(); } else if (clip) recShare(); else try { recStart(); } catch (e) { recBtn.textContent = 'NO REC'; } });

  /* pointer: what you press decides what the gesture does — mascot, a light, or the camera */
  const pts = new Map(); let role = null, moved = 0, pinch = 0, drag = null;
  const span = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('#btns, #rew, #labels')) return;
    stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size > 1) { if (role === 'mascot') { if (S.phys) throwIt(); else cancelCharge(); } role = 'cam'; moved = 99; pinch = span(); return; }
    moved = 0; drag = null;
    const h = pick(e);
    if (!h) role = 'cam';
    else if (h.name === 'mascot') { role = 'mascot'; press(); }
    else { role = 'light'; const g = onFloor(e, h.point.y); drag = { name: h.name, y: h.point.y, g, x: rigs[h.name].position.x, z: rigs[h.name].position.z, on: false }; }
  });
  stage.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId);
    if (!p) { if (!coarse) { const h = pick(e); stage.style.cursor = h ? (h.name === 'mascot' ? 'pointer' : 'move') : 'grab'; } return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 2) { const s = span(); if (pinch > 0) zoom(pinch / s); pinch = s; return; }
    moved += Math.abs(dx) + Math.abs(dy);
    if (role === 'mascot') {
      const t = onTrack(e); if (!t) return;
      if (S.phys && S.phys.held) { S.phys.tx = t[0]; S.phys.ty = t[1]; }
      else if (moved > 10 && !S.phys) { if (grab(t[0], t[1])) stage.style.cursor = 'grabbing'; }
    } else if (role === 'light') {
      if (moved > 8) { drag.on = true; const g = onFloor(e, drag.y); if (g && drag.g) { moveRig(drag.name, drag.x + g.x - drag.g.x, drag.z + g.z - drag.g.z); earn(8); stage.style.cursor = 'move'; } }
    } else if (moved > 8) { const k = 3.2 / Math.min(innerWidth, innerHeight); orbit(dx * k, dy * k * 0.7); stage.style.cursor = 'grabbing'; }
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId); stage.style.cursor = 'grab';
    if (pts.size) return;
    if (role === 'mascot') { if (S.phys) throwIt(); else if (e.type === 'pointerup') release(); else cancelCharge(); }
    else if (role === 'light' && drag && !drag.on && e.type === 'pointerup') toggleLight(drag.name);
    role = null; drag = null;
  };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => { e.preventDefault(); zoom(Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0012))); }, { passive: false });
  stage.addEventListener('contextmenu', e => e.preventDefault());

  /* keyboard: everything the pointer can do except throwing */
  let spaceDown = false;
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('button, input')) return;
    const k = e.key.toLowerCase(), st = 0.12;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!spaceDown) { spaceDown = true; press(); } }
    else if (k === 'arrowleft') orbit(st, 0); else if (k === 'arrowright') orbit(-st, 0); else if (k === 'arrowup') orbit(0, st); else if (k === 'arrowdown') orbit(0, -st);
    else if (k === '+' || k === '=') zoom(0.9); else if (k === '-') zoom(1.1);
    else if ('1234'.includes(k) && k) setView(['wide', 'close', 'side', 'top'][+k - 1]);
    else if (k === 'k') toggleLight('key'); else if (k === 'r') toggleLight('rim'); else if (k === 't') toggleLight('top');
    else if (k === 's') toggleSound(); else return;
    if (k.startsWith('arrow')) e.preventDefault();
  });
  addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') { if (spaceDown) { spaceDown = false; release(); } } });
  addEventListener('blur', () => { if (spaceDown) { spaceDown = false; release(); } });

  /* test hooks */
  window.debugPos = n => { const t = targets.find(o => o.userData.hit === n), v = t.getWorldPosition(new THREE.Vector3()).project(camera), r = canvas.getBoundingClientRect(); return [r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height]; };
  window.debugState = () => ({ clock: Math.round(clock), idx: S.idx, phys: !!S.phys, charging: !!S.charging, x: +core(clock).x.toFixed(2), y: +core(clock).y.toFixed(2), labels: TL.labelAt.map(v => v !== Infinity ? 1 : 0).join(''), lit: TL.litAt.map(v => v <= clock ? 1 : 0).join(''), speed: P.speed, rig: Object.fromEntries(Object.entries(rigs).map(([k, r]) => [k, [+r.position.x.toFixed(2), +r.position.z.toFixed(2)]])), lights: Object.fromEntries(Object.entries(TL.light).map(([k, l]) => [k, l.on])), rec: rec ? 'recording' : clip ? clip.name + ' ' + clip.size : 'idle' });

  let prev = 0;
  const loop = ts => {
    requestAnimationFrame(loop);
    if (document.hidden) { qLast = 0; prev = 0; return; }
    const dt = prev ? Math.min(0.1, (ts - prev) / 1000) : 0.016; prev = ts;
    if (!S.scrubbing) {
      clock += dt * FPS * P.speed;
      if (S.queued && idle()) { press(); release(); }
      while (S.phys && S.phys.M.c + S.phys.M.s.length <= clock + 1) stepPhys();
      for (let i = cues.length - 1; i >= 0; i--) if (cues[i].f <= clock) { const c = cues.splice(i, 1)[0]; c.run && c.run(); if (c.snd) sfxNow(c.snd); }
      if (clock > S.nextBlink) { TL.blinks = [clock]; S.nextBlink = clock + 150 + rng() * 240; }
      if ((clock | 0) % 90 === 0) prune(clock);
    }
    // ease the camera toward where the visitor put it; a slow ±6° drift returns when they leave it alone
    const k = 1 - Math.exp(-dt * 9);
    U.az += (U.taz - U.az) * k; U.el += (U.tel - U.el) * k; U.dist += (U.tdist - U.dist) * k;
    const calm = RM ? 0 : clamp((clock - S.touched - 240) / 240);
    U.sway = -6 * Math.PI / 180 * Math.sin(2 * Math.PI * clock / FRAMES) * calm;
    U.punch = !RM && S.punchAt != null && clock >= S.punchAt ? (1 - Math.exp(-(clock - S.punchAt) / 1.6)) * Math.exp(-(clock - S.punchAt) / 20) : 0;
    update(S.scrubbing ? S.scrubF : clock); draw(); adapt(ts);
    if (rec) recBtn.textContent = '● ' + ((performance.now() - recT) / 1000).toFixed(1) + 's';
  };
  window.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
